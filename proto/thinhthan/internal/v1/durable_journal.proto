    thinhthan.v1.S2CBeastFeedResult s2c_beast_feed_result = 2417;
    thinhthan.v1.S2CEntitlementClaimResult s2c_entitlement_claim_result = 2419;
    thinhthan.v1.S2CNpcShopBuyResult s2c_npc_shop_buy_result = 2421;
    thinhthan.v1.S2CCosmeticRedeemResult s2c_cosmetic_redeem_result = 2423;
    thinhthan.v1.S2CCosmeticEquipResult s2c_cosmetic_equip_result = 2425;
    thinhthan.v1.S2CNpcShopSellResult s2c_npc_shop_sell_result = 2427;
    thinhthan.v1.S2CInventoryExpandResult s2c_inventory_expand_result = 2429;
    thinhthan.v1.S2CBeastLevelUpResult s2c_beast_level_up_result = 2431;
    thinhthan.v1.S2CQuestAcceptResult s2c_quest_accept_result = 2501;
    thinhthan.v1.S2CQuestUpdate s2c_quest_update = 2503;
    thinhthan.v1.S2CAtlasClaimResult s2c_atlas_claim_result = 2505;
