message JournalEntryMember {
  bytes character_id = 1;
  bytes account_id = 2;
  string decision = 3;
  JournalCheckpoint checkpoint = 4;
}

message JournalCreatedId {
  string kind = 1;
  optional bytes id = 2;
  optional string content_id = 3;
}

message JournalOutcome {
  thinhthan.v1.ResultStatus status = 1;
  thinhthan.v1.ErrorCode error_code = 2;
  bytes operation_id = 3;
  repeated JournalRewardSlot reward_slots = 4;
  repeated JournalCreatedId created_ids = 5;
  repeated JournalAggregateRevision revisions = 6;
  optional JournalEnhanceResult enhancement = 7;
  optional JournalCheckpoint checkpoint = 8;
  optional JournalPublicSchedule schedule = 9;
  optional JournalMatch match = 10;
  optional JournalCompetitiveAdmission competitive_admission = 11;
  optional JournalCraftSnapshot craft = 12;
