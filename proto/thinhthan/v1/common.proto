syntax = "proto3";

package thinhthan.v1;

option go_package = "thinhthan/internal/protocol/v1;protocolv1";
option csharp_namespace = "ThinhThan.Protocol.V1";

// Error codes: numbering authority is this enum. Codes 1..112 enumerate every
// code in errors.md section Canonical Codes in order of first appearance,
// fenced blocks in document order, each block row-major. New codes append only;
// numbers are never reused or reordered.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL_MALFORMED = 1;
  ERROR_CODE_PROTOCOL_UNSUPPORTED = 2;
  ERROR_CODE_PROTOCOL_VIOLATION = 3;
  ERROR_CODE_MESSAGE_UNKNOWN = 4;
  ERROR_CODE_MESSAGE_TOO_LARGE = 5;
  ERROR_CODE_MESSAGE_NOT_ALLOWED_IN_STATE = 6;
  ERROR_CODE_CLIENT_UPDATE_REQUIRED = 7;
  ERROR_CODE_CONTENT_INCOMPATIBLE = 8;
  ERROR_CODE_RATE_LIMITED = 9;
  ERROR_CODE_SERVER_OVERLOADED = 10;
  ERROR_CODE_SERVER_DRAINING = 11;
  ERROR_CODE_AUTH_REQUIRED = 12;
  ERROR_CODE_AUTH_INVALID = 13;
  ERROR_CODE_AUTH_EXPIRED = 14;
  ERROR_CODE_SESSION_EPOCH_STALE = 15;
  ERROR_CODE_SESSION_REPLACED = 16;
  ERROR_CODE_CHARACTER_ALREADY_ACTIVE = 17;
  ERROR_CODE_RESUME_EXPIRED = 18;
  ERROR_CODE_ACCOUNT_BANNED = 19;
  ERROR_CODE_ACCOUNT_PENDING_DELETION = 20;
  ERROR_CODE_ACCOUNT_SUSPENDED = 21;
  ERROR_CODE_ENTITLEMENT_REVOKED = 22;
  ERROR_CODE_USERNAME_INVALID = 23;
  ERROR_CODE_EMAIL_INVALID = 24;
  ERROR_CODE_PASSWORD_INVALID = 25;
  ERROR_CODE_USERNAME_TAKEN = 26;
  ERROR_CODE_EMAIL_TAKEN = 27;
  ERROR_CODE_PROVIDER_ALREADY_LINKED = 28;
  ERROR_CODE_LAST_LOGIN_METHOD = 29;
  ERROR_CODE_CREDENTIAL_CHANGE_LOCKED = 30;
  ERROR_CODE_CHARACTER_NAME_INVALID = 31;
  ERROR_CODE_CHARACTER_NAME_TAKEN = 32;
  ERROR_CODE_CHARACTER_SLOTS_FULL = 33;
  ERROR_CODE_OWNER_NOT_FOUND = 34;
  ERROR_CODE_OWNER_CHANGED = 35;
  ERROR_CODE_TRANSFER_IN_PROGRESS = 36;
  ERROR_CODE_TRANSFER_FAILED = 37;
  ERROR_CODE_STALE_INPUT = 38;
  ERROR_CODE_INVALID_TARGET = 39;
  ERROR_CODE_INVALID_STATE = 40;
  ERROR_CODE_MAP_CAPACITY_FULL = 41;
  ERROR_CODE_OPERATION_CONFLICT = 42;
  ERROR_CODE_OPERATION_IN_PROGRESS = 43;
  ERROR_CODE_OPERATION_REJECTED = 44;
  ERROR_CODE_TEMPORARY_DEPENDENCY_FAILURE = 45;
  ERROR_CODE_IAP_RECEIPT_ACCOUNT_MISMATCH = 46;
  ERROR_CODE_IAP_PRODUCT_MISMATCH = 47;
  ERROR_CODE_IAP_RECEIPT_INVALID = 48;
  ERROR_CODE_IAP_SEASON_TRACK_DUPLICATE = 49;
  ERROR_CODE_IAP_VERIFICATION_PENDING = 50;
  ERROR_CODE_CHEST_ELIGIBILITY_INVALID = 51;
  ERROR_CODE_TRADE_PARTNER_DISCONNECTED = 52;
  ERROR_CODE_TRADE_ELIGIBILITY_LEVEL_REQUIRED = 53;
  ERROR_CODE_TRADE_ELIGIBILITY_AGE_REQUIRED = 54;
  ERROR_CODE_AH_ELIGIBILITY_LEVEL_REQUIRED = 55;
  ERROR_CODE_AH_ELIGIBILITY_AGE_REQUIRED = 56;
  ERROR_CODE_TRADE_COMMON_BOTH_SIDES = 57;
  ERROR_CODE_TRADE_PRICE_FLOOR_NOT_MET = 58;
  ERROR_CODE_AH_PRICE_FLOOR_NOT_MET = 59;
  ERROR_CODE_SAME_ACCOUNT_FORBIDDEN = 60;
  ERROR_CODE_INVENTORY_FULL = 61;
