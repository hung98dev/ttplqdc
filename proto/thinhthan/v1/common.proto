  ERROR_CODE_CHAT_TEXT_INVALID = 110;
  ERROR_CODE_OPERATION_EXPIRED = 111;
  ERROR_CODE_REQUEST_TOO_LARGE = 112;
}

enum Retryability {
  RETRYABILITY_UNSPECIFIED = 0;
  RETRYABILITY_NEVER = 1;
  RETRYABILITY_RETRY_SAME_OPERATION = 2;
  RETRYABILITY_RECONNECT = 3;
  RETRYABILITY_UPDATE_REQUIRED = 4;
  RETRYABILITY_REAUTHENTICATE = 5;
  RETRYABILITY_BACKOFF = 6;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_SUCCESS = 1;
  RESULT_STATUS_ERROR = 2;
}

message OperationResult {
  bytes operation_id = 1;       // UUID, 16 bytes
  ResultStatus status = 2;
  ErrorCode error_code = 3;
}

message ItemQuantity {
  string item_id = 1;
  uint32 quantity = 2;
}

message ItemGrant {
  bytes item_instance_id = 1;   // UUID, 16 bytes
  string item_id = 2;
  uint32 quantity = 3;
}

message CurrencyDelta {
  string currency_id = 1;
  int64 amount = 2;
}

message PositionMm {
  sint32 x_mm = 1;
  sint32 y_mm = 2;
}

enum Element {
  ELEMENT_UNSPECIFIED = 0;
  ELEMENT_KIM = 1;
  ELEMENT_THUY = 2;
  ELEMENT_MOC = 3;
  ELEMENT_HOA = 4;
  ELEMENT_THO = 5;
  ELEMENT_PHYSICAL = 6;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  ENTITY_KIND_NPC = 3;
  ENTITY_KIND_BEAST = 4;
  ENTITY_KIND_OBJECT = 5;
  ENTITY_KIND_PROJECTILE = 6;
}

enum Facing {
  FACING_UNSPECIFIED = 0;
  FACING_LEFT = 1;
  FACING_RIGHT = 2;
}

enum MovementState {
  MOVEMENT_STATE_UNSPECIFIED = 0;
  MOVEMENT_STATE_IDLE = 1;
  MOVEMENT_STATE_RUN = 2;
  MOVEMENT_STATE_JUMP = 3;
  MOVEMENT_STATE_FALL = 4;
  MOVEMENT_STATE_KNOCKBACK = 5;
}

enum HeldHorizontalIntent {
  HELD_HORIZONTAL_INTENT_NONE = 0;
  HELD_HORIZONTAL_INTENT_LEFT = 1;
  HELD_HORIZONTAL_INTENT_RIGHT = 2;
}

enum CosmeticSlot {
  COSMETIC_SLOT_UNSPECIFIED = 0;
  COSMETIC_SLOT_TITLE = 1;
  COSMETIC_SLOT_TITLE_GLOW = 2;
  COSMETIC_SLOT_FRAME = 3;
  COSMETIC_SLOT_NAMEPLATE = 4;
  COSMETIC_SLOT_APPEARANCE = 5;
  COSMETIC_SLOT_WEAPON_TRAIL = 6;
  COSMETIC_SLOT_AURA = 7;
  COSMETIC_SLOT_CHARACTER_SHRINE = 8;
  COSMETIC_SLOT_GUILD_STONE_INSCRIPTION = 9;
}

enum RewardClaimState {
  REWARD_CLAIM_STATE_UNSPECIFIED = 0;
  REWARD_CLAIM_STATE_PENDING = 1;
  REWARD_CLAIM_STATE_CLAIMED = 2;
}

message CharacterSummary {
  bytes character_id = 1;       // UUID, 16 bytes
  string character_name = 2;
  string class_id = 3;
  uint32 level = 4;
  string map_id = 5;
  int64 last_online_at_ms = 6;
  bool is_attached = 7;
}

message EntityStatus {
  string effect_id = 1;
  uint64 source_entity_id = 2;
  uint32 stacks = 3;
  uint64 expires_at_tick = 4;
}

message EquippedCosmetic {
  CosmeticSlot slot = 1;
  string cosmetic_id = 2;
}

message EntityState {
  uint64 entity_id = 1;
  EntityKind entity_kind = 2;
  string content_id = 3;
  bytes character_id = 4;       // UUID, 16 bytes
  string display_name = 5;
  uint32 level = 6;
  uint64 owner_entity_id = 7;
  sint32 x_mm = 8;
  sint32 y_mm = 9;
  sint32 vx_mm_s = 10;
  sint32 vy_mm_s = 11;
  Facing facing = 12;
  MovementState movement_state = 13;
  int64 hp = 14;
  int64 max_hp = 15;
  int64 shield = 16;
  uint32 flags = 17;
  repeated EntityStatus statuses = 18;
  repeated EquippedCosmetic equipped_cosmetics = 19;
  uint64 encounter_id = 20;
  uint32 stat_lifesteal = 21;
  uint32 stat_reflect = 22;
  uint32 stat_absorb = 23;
  uint32 stat_heal_reduction = 24;
  uint32 stat_healing_received = 25;
}

message RewardClaimLine {
  oneof grant {
    string item_id = 1;
    string currency_id = 2;
  }
  uint32 quantity = 3;
}

message RewardClaimView {
  bytes reward_claim_id = 1;    // UUID, 16 bytes
  string source_type = 2;
  string source_reference = 3;
  string reward_slot = 4;
  RewardClaimState state = 5;
  repeated RewardClaimLine lines = 6;
  int64 created_at_ms = 7;
  int64 expires_at_ms = 8;
}

message EffectiveMovementParameters {
  uint32 run_speed_mm_s = 1;
  uint32 first_jump_mm_s = 2;
  uint32 second_jump_mm_s = 3;
  uint32 gravity_mm_s2 = 4;
  uint32 max_fall_mm_s = 5;
  uint32 air_control_bp = 6;
  uint32 max_step_height_mm = 7;
}

message MovementCheckpoint {
  sint32 x_mm = 1;
  sint32 y_mm = 2;
  sint32 vx_mm_s = 3;
  sint32 vy_mm_s = 4;
  Facing facing = 5;
  MovementState movement_state = 6;
  uint64 platform_id = 7;            // 0 = none
  bool is_grounded = 8;
  uint32 jump_count = 9;             // 0..2
  uint64 drop_ignore_platform_id = 10;  // 0 = none
  uint64 drop_ignore_until_tick = 11;   // 0 = none
  HeldHorizontalIntent held_horizontal_intent = 12;
  EffectiveMovementParameters effective_parameters = 13;
}

message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  uint32 message_id = 3;
  uint64 session_epoch = 4;
  uint64 client_seq = 5;
  uint64 server_seq = 6;
  uint64 correlation_id = 7;
  bytes payload = 8;
}
