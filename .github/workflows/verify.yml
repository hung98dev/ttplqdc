name: verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  actions: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  unity-windows:
    name: Unity (Windows)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Fork guard
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request|pull_request_target)
              if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
                echo "external PRs not accepted" >&2
                exit 1
              fi
              ;;
          esac

      - name: Freeze check
        shell: bash
        env:
          FROZEN: ${{ vars.AUTO_MERGE_FROZEN }}
        run: |
          set -euo pipefail
          if [ "${FROZEN:-false}" = "true" ]; then
            case "${{ github.head_ref || github.ref_name }}" in
              revert/*|ops/*) exit 0 ;;
            esac
            echo "AUTO_MERGE_FROZEN is set" >&2
            exit 1
          fi

      - name: Cache timer cli-tools
        shell: bash
        run: echo "CT0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Cache CLI tools
        id: cache-cli-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tools
          key: cli-tools-${{ runner.os }}-pwsh-7.6.6-02fe458be20493fb-gh-2.101.0-bc6c814367b193cd-jq-1.8.2-a6fc67fedaf9128a-lfs-3.8.0-b62e7b8ceddee635

      - name: Telemetry cli-tools
        shell: bash
        run: |
          set -euo pipefail
          f="${THINHTHAN_CACHE_TELEMETRY:-$RUNNER_TEMP/cache-telemetry.jsonl}"
          mkdir -p "$(dirname "$f")"
          wall=$(awk -v n="$(date +%s.%N)" -v t="${CT0:-0}" 'BEGIN{printf "%.3f", (t > 0) ? n - t : 0}')
          printf '{"step":"cli-tools","result":"%s","wall_seconds":%s}\n' '${{ steps.cache-cli-tools.outputs.cache-hit == 'true' && 'hit' || 'miss' }}' "$wall" >> "$f"

      - name: Install pinned CLI tools
        if: steps.cache-cli-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/bin"
          # pwsh 7.6.6
          curl -fsSL -o "$RUNNER_TEMP/pwsh.zip" \
            "https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip"
          echo "02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860  $RUNNER_TEMP/pwsh.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools/pwsh" && 7z x -y -o"$RUNNER_TEMP/tools/pwsh" "$RUNNER_TEMP/pwsh.zip" > /dev/null
          # gh 2.101.0
          curl -fsSL -o "$RUNNER_TEMP/gh.zip" \
            "https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_windows_amd64.zip"
          echo "bc6c814367b193cd8e713611d61e36013c0ef843b8f516458fe3eda039192794  $RUNNER_TEMP/gh.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools/gh" && 7z x -y -o"$RUNNER_TEMP/tools/gh" "$RUNNER_TEMP/gh.zip" > /dev/null
          cp "$(find "$RUNNER_TEMP/tools/gh" -name gh.exe | head -1)" "$RUNNER_TEMP/tools/bin/gh.exe"
          # jq 1.8.2
          curl -fsSL -o "$RUNNER_TEMP/tools/bin/jq.exe" \
            "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-amd64.exe"
          echo "a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627  $RUNNER_TEMP/tools/bin/jq.exe" | sha256sum -c -
          # git-lfs 3.8.0
          curl -fsSL -o "$RUNNER_TEMP/lfs.zip" \
            "https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-windows-amd64-v3.8.0.zip"
          echo "b62e7b8ceddee635f691233d77de8eaa4b213e9209e0173811d8cfa77f7882c1  $RUNNER_TEMP/lfs.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools/lfs" && 7z x -y -o"$RUNNER_TEMP/tools/lfs" "$RUNNER_TEMP/lfs.zip" > /dev/null
          cp "$(find "$RUNNER_TEMP/tools/lfs" -name git-lfs.exe | head -1)" "$RUNNER_TEMP/tools/bin/git-lfs.exe"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/pwsh" >> "$GITHUB_PATH"

      - name: CLI tools on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/pwsh" >> "$GITHUB_PATH"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34
        with:
          go-version: '1.27.1'
          cache: false

      - name: Resolve pins
        shell: bash
        run: |
          set -euo pipefail
          echo "GO_VERSION=$(go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -print-pin go-version)" >> "$GITHUB_ENV"
          echo "UNITY_WINDOWS_EDITOR_URL=$(go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -print-pin unity-installer-url)" >> "$GITHUB_ENV"
          echo "UNITY_WINDOWS_EDITOR_SHA256=$(go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -print-pin unity-installer-sha256)" >> "$GITHUB_ENV"
          echo "UNITY_EDITOR_VERSION_PIN=$(go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -print-pin unity-editor-version)" >> "$GITHUB_ENV"
          echo "UNITY_EDITOR_CHANGESET=$(go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -print-pin unity-editor-changeset)" >> "$GITHUB_ENV"

      - name: Unity scope + mode plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -plan-unity artifacts/unity-plan.json
          cat artifacts/unity-plan.json
          for k in scope editmode playmode visual_review performance graphical_load; do
            echo "$k=$(jq -r ".$k" artifacts/unity-plan.json)" >> "$GITHUB_OUTPUT"
          done

      - name: Cache timer go-build
        shell: bash
        run: echo "CT0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Cache Go build
        id: cache-go-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: go-build-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Telemetry go-build
        shell: bash
        run: |
          set -euo pipefail
          . .devin/scripts/cache_telemetry.sh
          wall=$(awk -v n="$(date +%s.%N)" -v t="${CT0:-0}" 'BEGIN{printf "%.3f", (t > 0) ? n - t : 0}')
          cache_telemetry_emit go-build '${{ steps.cache-go-build.outputs.cache-hit == 'true' && 'hit' || 'miss' }}' "$wall"

      - name: Compute LFS objects key
        id: lfskey
        shell: bash
        run: |
          set -euo pipefail
          oids=$(git lfs ls-files --long 2>/dev/null | awk '{print $1}' | sort | sha256sum | cut -d' ' -f1)
          echo "key=${oids:-empty}" >> "$GITHUB_OUTPUT"

      - name: Cache timer lfs-objects
        if: steps.plan.outputs.scope == 'full'
        shell: bash
        run: echo "CT0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Cache LFS objects
        id: cache-lfs
        if: steps.plan.outputs.scope == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .git/lfs/objects
          key: lfs-objects-${{ runner.os }}-${{ steps.lfskey.outputs.key }}
          restore-keys: |
            lfs-objects-${{ runner.os }}-

      - name: Telemetry lfs-objects
        if: steps.plan.outputs.scope == 'full'
        shell: bash
        run: |
          set -euo pipefail
          . .devin/scripts/cache_telemetry.sh
          wall=$(awk -v n="$(date +%s.%N)" -v t="${CT0:-0}" 'BEGIN{printf "%.3f", (t > 0) ? n - t : 0}')
          cache_telemetry_emit lfs-objects '${{ steps.cache-lfs.outputs.cache-hit == 'true' && 'hit' || 'miss' }}' "$wall"

      - name: LFS pull
        if: steps.plan.outputs.scope == 'full'
        shell: bash
        run: git lfs pull

      - name: Cache timer unity-editor
        if: steps.plan.outputs.scope == 'full'
        shell: bash
        run: echo "CT0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Cache Unity editor
        id: cache-editor
        if: steps.plan.outputs.scope == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/unity-editor
          key: unity-editor-${{ runner.os }}-${{ env.UNITY_WINDOWS_EDITOR_SHA256 }}

      - name: Telemetry unity-editor
        if: steps.plan.outputs.scope == 'full'
        shell: bash
        run: |
          set -euo pipefail
          . .devin/scripts/cache_telemetry.sh
          wall=$(awk -v n="$(date +%s.%N)" -v t="${CT0:-0}" 'BEGIN{printf "%.3f", (t > 0) ? n - t : 0}')
          cache_telemetry_emit unity-editor '${{ steps.cache-editor.outputs.cache-hit == 'true' && 'hit' || 'miss' }}' "$wall"

      - name: Install Unity editor
        if: steps.plan.outputs.scope == 'full' && steps.cache-editor.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\unity-editor"
          $installer = "$env:RUNNER_TEMP\UnitySetup64.exe"
          Invoke-WebRequest -Uri $env:UNITY_WINDOWS_EDITOR_URL -OutFile $installer
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:UNITY_WINDOWS_EDITOR_SHA256) { throw "installer sha256 mismatch: $sha" }
          & $installer /S /D=$dir | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }

      - name: Cache timer unity-library
        if: steps.plan.outputs.scope == 'full'
        shell: bash
        run: echo "CT0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Cache client Library
        id: cache-library
        if: steps.plan.outputs.scope == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: client/Library
          # Source-scoped: Library holds compiled assemblies and importer
          # metadata derived from the whole client tree, so the key hashes
          # every source path it derives from. No restore-keys — a prefix
          # match would restore another branch's Library (stale
          # ScriptAssemblies, drift-check .meta diffs).
          key: unity-library-${{ runner.os }}-${{ env.UNITY_WINDOWS_EDITOR_SHA256 }}-${{ hashFiles('client/Packages/manifest.json', 'client/Packages/packages-lock.json', 'client/ProjectSettings/**', 'client/Assets/**/csc.rsp', 'client/Assets/**') }}

      - name: Telemetry unity-library
        if: steps.plan.outputs.scope == 'full'
        shell: bash
        run: |
          set -euo pipefail
          . .devin/scripts/cache_telemetry.sh
          wall=$(awk -v n="$(date +%s.%N)" -v t="${CT0:-0}" 'BEGIN{printf "%.3f", (t > 0) ? n - t : 0}')
          cache_telemetry_emit unity-library '${{ steps.cache-library.outputs.cache-hit == 'true' && 'hit' || 'miss' }}' "$wall"

      - name: Activate Unity licence
        if: steps.plan.outputs.scope == 'full'
        timeout-minutes: 30
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = "$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe"
          $licClient = "$env:RUNNER_TEMP\unity-editor\Editor\Data\Resources\Licensing\Client\Unity.Licensing.Client.exe"
          $uargs = @('-batchmode','-nographics','-quit','-logFile','artifacts\unity-tests\licence-activation.log')
          $useLicClient = $false
          if ($env:UNITY_LICENSE) {
            $ulf = "$env:RUNNER_TEMP\Unity_lic.ulf"
            [IO.File]::WriteAllText($ulf, $env:UNITY_LICENSE)
            $uargs += @('-manualLicenseFile', $ulf)
          } elseif ($env:UNITY_SERIAL) {
            $uargs += @('-username', $env:UNITY_EMAIL, '-password', $env:UNITY_PASSWORD, '-serial', $env:UNITY_SERIAL)
          } else {
            $useLicClient = $true
          }
          New-Item -ItemType Directory -Force artifacts\unity-tests | Out-Null
          for ($i = 1; $i -le 5; $i++) {
            if ($useLicClient) {
              # assigns a Personal seat; exit may be 1 on VMs without a BIOS
              # serial, so the Unity run below is the real verdict
              & $licClient --activate-all --include-personal --username $env:UNITY_EMAIL --password $env:UNITY_PASSWORD 2>&1 | Out-Host
            }
            & $editor @uargs
            $ec = $LASTEXITCODE
            # Unity.exe can detach on hosted runners: also accept the
            # editor's own clean-exit marker, and drain any lingering
            # editor process before the next attempt.
            Get-Process -Name Unity -ErrorAction SilentlyContinue | Wait-Process -Timeout 90 -ErrorAction SilentlyContinue
            $txt = Get-Content "artifacts\unity-tests\licence-activation.log" -Raw -ErrorAction SilentlyContinue
            if ($ec -eq 0 -or $txt -match 'Exiting batchmode successfully') {
              Write-Host "licence activated (attempt $i)"; exit 0
            }
            Write-Host "activation attempt $i failed; retry in 60s"
            Start-Sleep -Seconds 60
          }
          throw "licence activation failed after 5 attempts"

      - name: Record editor version
        if: steps.plan.outputs.scope == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pv = Select-String -Path client\ProjectSettings\ProjectVersion.txt -Pattern 'm_EditorVersion: (.+)' | ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          New-Item -ItemType Directory -Force artifacts\unity-tests | Out-Null
          "$env:UNITY_EDITOR_VERSION_PIN ($env:UNITY_EDITOR_CHANGESET) project=$pv installer_sha256=$env:UNITY_WINDOWS_EDITOR_SHA256" |
            Out-File -Encoding ascii artifacts\unity-tests\editor-version.txt
          if ($pv -ne $env:UNITY_EDITOR_VERSION_PIN) { throw "ProjectVersion $pv != pin $env:UNITY_EDITOR_VERSION_PIN" }

      - name: Materialize client
        if: steps.plan.outputs.scope == 'full'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = "$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe"
          $compileFails = 0
          for ($i = 1; $i -le 5; $i++) {
            Get-Process -Name Unity -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Wait-Process -Name Unity -Timeout 30 -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force client\Temp -ErrorAction SilentlyContinue
            $log = "artifacts\unity-tests\materialize-editor-$i.log"
            # Unity.exe may detach on hosted runners: the verdict is the
            # editor log's terminal marker, not the launcher exit code.
            $null = Start-Process -FilePath $editor -PassThru -ArgumentList `
              '-batchmode','-quit','-projectPath',"$PWD\client",'-logFile',$log
            $verdict = $null
            $deadline = (Get-Date).AddMinutes(20)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 10
              $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
              if ($txt -match 'Exiting batchmode successfully') { $verdict = 'ok'; break }
              if ($txt -match 'another Unity instance') { $verdict = 'infra'; break }
              if (-not (Get-Process -Name Unity -ErrorAction SilentlyContinue)) {
                if ($txt -match 'Scripts have compiler errors|error CS\d+') { $verdict = 'compile' }
                else { $verdict = 'infra' }
                break
              }
            }
            Get-Process -Name Unity -ErrorAction SilentlyContinue | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $verdict) {
              Get-Process -Name Unity -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
              if ($txt -match 'Exiting batchmode successfully') { $verdict = 'ok' }
              elseif ($txt -match 'Scripts have compiler errors|error CS\d+') { $verdict = 'compile' }
              else { $verdict = 'infra' }
            }
            if ($verdict -eq 'ok') { Write-Host "materialized (attempt $i)"; exit 0 }
            if ($verdict -eq 'compile') {
              $compileFails++
              if ($compileFails -ge 2) { throw "two consecutive compile-error attempts" }
              Remove-Item -Recurse -Force client\Library -ErrorAction SilentlyContinue
              continue  # compile-error retry: immediately, on a clean Library
            }
            $compileFails = 0
            Start-Sleep -Seconds 60  # licence/infra failure: wait then retry
          }
          throw "materialization failed after 5 attempts"

      - name: Run EditMode tests
        if: steps.plan.outputs.scope == 'full' && steps.plan.outputs.editmode == 'true'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = "$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe"
          Get-Process -Name Unity -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Wait-Process -Name Unity -Timeout 30 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force client\Temp -ErrorAction SilentlyContinue
          $log = "$PWD\artifacts\unity-tests\editmode-editor.log"
          $xml = "$PWD\artifacts\unity-tests\editmode-results.xml"
          # Unity.exe may detach on hosted runners: the verdict is the
          # UTF completion marker + results XML, not the launcher exit code.
          $null = Start-Process -FilePath $editor -PassThru -ArgumentList `
            '-batchmode','-nographics','-runTests','-testPlatform','EditMode','-projectPath',"$PWD\client",'-testResults',$xml,'-logFile',$log
          $deadline = (Get-Date).AddMinutes(25)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
            if ($txt -match 'Test run completed|Exiting batchmode') { break }
            if (-not (Get-Process -Name Unity -ErrorAction SilentlyContinue)) { break }
          }
          Get-Process -Name Unity -ErrorAction SilentlyContinue | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
          if ($txt -match 'Test run completed\. Exiting with code 0' -and (Test-Path $xml)) { exit 0 }
          Write-Host "::error::editmode run did not complete cleanly (see editor log)"
          exit 1
      - name: Run PlayMode tests
        if: steps.plan.outputs.scope == 'full' && steps.plan.outputs.playmode == 'true'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = "$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe"
          Get-Process -Name Unity -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Wait-Process -Name Unity -Timeout 30 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force client\Temp -ErrorAction SilentlyContinue
          $log = "$PWD\artifacts\unity-tests\playmode-editor.log"
          $xml = "$PWD\artifacts\unity-tests\playmode-results.xml"
          # Unity.exe may detach on hosted runners: the verdict is the
          # UTF completion marker + results XML, not the launcher exit code.
          $null = Start-Process -FilePath $editor -PassThru -ArgumentList `
            '-batchmode','-nographics','-runTests','-testPlatform','PlayMode','-projectPath',"$PWD\client",'-testResults',$xml,'-logFile',$log
          $deadline = (Get-Date).AddMinutes(25)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
            if ($txt -match 'Test run completed|Exiting batchmode') { break }
            if (-not (Get-Process -Name Unity -ErrorAction SilentlyContinue)) { break }
          }
          Get-Process -Name Unity -ErrorAction SilentlyContinue | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
          if ($txt -match 'Test run completed\. Exiting with code 0' -and (Test-Path $xml)) { exit 0 }
          Write-Host "::error::playmode run did not complete cleanly (see editor log)"
          exit 1
      - name: Run Performance tests (D3D11 WARP)
        if: steps.plan.outputs.scope == 'full' && steps.plan.outputs.performance == 'true'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = "$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe"
          Get-Process -Name Unity -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Wait-Process -Name Unity -Timeout 30 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force client\Temp -ErrorAction SilentlyContinue
          $log = "$PWD\artifacts\unity-tests\performance-editor.log"
          $xml = "$PWD\artifacts\unity-tests\performance-results.xml"
          # Unity.exe may detach on hosted runners: the verdict is the
          # UTF completion marker + results XML, not the launcher exit code.
          $null = Start-Process -FilePath $editor -PassThru -ArgumentList `
            '-batchmode','-force-d3d11','-runTests','-testPlatform','EditMode','-testCategory','Performance','-projectPath',"$PWD\client",'-testResults',$xml,'-logFile',$log
          $deadline = (Get-Date).AddMinutes(25)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
            if ($txt -match 'Test run completed|Exiting batchmode') { break }
            if (-not (Get-Process -Name Unity -ErrorAction SilentlyContinue)) { break }
          }
          Get-Process -Name Unity -ErrorAction SilentlyContinue | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
          if ($txt -match 'Test run completed\. Exiting with code 0' -and (Test-Path $xml)) { exit 0 }
          Write-Host "::error::performance run did not complete cleanly (see editor log)"
          exit 1
      - name: Run Visual Review (D3D11 WARP)
        if: steps.plan.outputs.scope == 'full' && steps.plan.outputs.visual_review == 'true'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $editor = "$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe"
          Get-Process -Name Unity -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Wait-Process -Name Unity -Timeout 30 -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force client\Temp -ErrorAction SilentlyContinue
          $log = "$PWD\artifacts\unity-tests\visualreview-editor.log"
          $xml = "$PWD\artifacts\unity-tests\visualreview-results.xml"
          # Unity.exe may detach on hosted runners: the verdict is the
          # UTF completion marker + results XML, not the launcher exit code.
          $null = Start-Process -FilePath $editor -PassThru -ArgumentList `
            '-batchmode','-force-d3d11','-runTests','-testPlatform','EditMode','-testCategory','VisualReview','-projectPath',"$PWD\client",'-testResults',$xml,'-logFile',$log
          $deadline = (Get-Date).AddMinutes(25)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
            if ($txt -match 'Test run completed|Exiting batchmode') { break }
            if (-not (Get-Process -Name Unity -ErrorAction SilentlyContinue)) { break }
          }
          Get-Process -Name Unity -ErrorAction SilentlyContinue | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
          if ($txt -match 'Test run completed\. Exiting with code 0' -and (Test-Path $xml)) { exit 0 }
          Write-Host "::error::visualreview run did not complete cleanly (see editor log)"
          exit 1
      - name: Drift check (unity-materialized)
        id: drift
        if: always() && steps.plan.outputs.scope == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # m_currentHash.Hash sole-diff exemption on AddressableAssetSettings.asset
          $f = 'client/Assets/AddressableAssetsData/AddressableAssetSettings.asset'
          if (Test-Path $f) {
            $d = git diff -- $f
            $changed = ($d | Select-String '^[+-]').Line | Where-Object { $_ -notmatch '^(\+\+\+|---)' }
            if ($changed -and ($changed | Where-Object { $_ -notmatch 'm_currentHash' }).Count -eq 0) {
              git checkout -- $f
            }
          }
          $dirty = git status --porcelain -- client/
          if ($dirty) {
            $dirty | Out-Host
            Write-Host "::error::commit unity-materialized"
            echo "changed=true" >> "$env:GITHUB_OUTPUT"
            exit 1
          }
          echo "changed=false" >> "$env:GITHUB_OUTPUT"

      - name: Upload unity-materialized-windows
        if: failure() && steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unity-materialized-windows
          path: client/

      - name: Ship cache telemetry
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/unity-tests
          if [ -f "$RUNNER_TEMP/cache-telemetry.jsonl" ]; then
            cp "$RUNNER_TEMP/cache-telemetry.jsonl" artifacts/unity-tests/
          fi

      - name: Upload unity-test-results-windows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unity-test-results-windows
          path: artifacts/unity-tests/

      - name: Upload visual-review
        if: always() && hashFiles('artifacts/visual-review/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-review
          path: artifacts/visual-review/

      - name: Return Unity licence
        if: always()
        shell: pwsh
        run: |
          $editor = "$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe"
          $licClient = "$env:RUNNER_TEMP\unity-editor\Editor\Data\Resources\Licensing\Client\Unity.Licensing.Client.exe"
          if (Test-Path $licClient) {
            $j = Start-Job { & $using:licClient --return-entitlement; if ($LASTEXITCODE -ne 0) { & $using:licClient --deactivate } }
            if (-not ($j | Wait-Job -Timeout 90)) { $j | Stop-Job }
          }
          Remove-Item "$env:LOCALAPPDATA\Unity\licenses\*.xml" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:ProgramData\Unity\Unity_lic.ulf" -Force -ErrorAction SilentlyContinue
          if (Test-Path $editor) {
            $j = Start-Job { & $using:editor -batchmode -quit -returnlicense }
            if (-not ($j | Wait-Job -Timeout 90)) { $j | Stop-Job }
          }

  verify-windows:
    name: Q0-Q6 verify (Windows)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Fork guard
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request|pull_request_target)
              if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
                echo "external PRs not accepted" >&2
                exit 1
              fi
              ;;
          esac

      - name: Freeze check
        shell: bash
        env:
          FROZEN: ${{ vars.AUTO_MERGE_FROZEN }}
        run: |
          set -euo pipefail
          if [ "${FROZEN:-false}" = "true" ]; then
            case "${{ github.head_ref || github.ref_name }}" in
              revert/*|ops/*) exit 0 ;;
            esac
            echo "AUTO_MERGE_FROZEN is set" >&2
            exit 1
          fi

      - name: Cache timer cli-tools
        shell: bash
        run: echo "CT0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Cache CLI tools
        id: cache-cli-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tools
          key: cli-tools-${{ runner.os }}-pwsh-7.6.6-02fe458be20493fb-gh-2.101.0-bc6c814367b193cd-jq-1.8.2-a6fc67fedaf9128a-lfs-3.8.0-b62e7b8ceddee635

      - name: Telemetry cli-tools
        shell: bash
        run: |
          set -euo pipefail
          f="${THINHTHAN_CACHE_TELEMETRY:-$RUNNER_TEMP/cache-telemetry.jsonl}"
          mkdir -p "$(dirname "$f")"
          wall=$(awk -v n="$(date +%s.%N)" -v t="${CT0:-0}" 'BEGIN{printf "%.3f", (t > 0) ? n - t : 0}')
          printf '{"step":"cli-tools","result":"%s","wall_seconds":%s}\n' '${{ steps.cache-cli-tools.outputs.cache-hit == 'true' && 'hit' || 'miss' }}' "$wall" >> "$f"

      - name: Install pinned CLI tools
        if: steps.cache-cli-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/bin"
          curl -fsSL -o "$RUNNER_TEMP/pwsh.zip" \
            "https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip"
          echo "02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860  $RUNNER_TEMP/pwsh.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools/pwsh" && 7z x -y -o"$RUNNER_TEMP/tools/pwsh" "$RUNNER_TEMP/pwsh.zip" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/gh.zip" \
            "https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_windows_amd64.zip"
          echo "bc6c814367b193cd8e713611d61e36013c0ef843b8f516458fe3eda039192794  $RUNNER_TEMP/gh.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools/gh" && 7z x -y -o"$RUNNER_TEMP/tools/gh" "$RUNNER_TEMP/gh.zip" > /dev/null
          cp "$(find "$RUNNER_TEMP/tools/gh" -name gh.exe | head -1)" "$RUNNER_TEMP/tools/bin/gh.exe"
          curl -fsSL -o "$RUNNER_TEMP/tools/bin/jq.exe" \
            "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-amd64.exe"
          echo "a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627  $RUNNER_TEMP/tools/bin/jq.exe" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/lfs.zip" \
            "https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-windows-amd64-v3.8.0.zip"
          echo "b62e7b8ceddee635f691233d77de8eaa4b213e9209e0173811d8cfa77f7882c1  $RUNNER_TEMP/lfs.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools/lfs" && 7z x -y -o"$RUNNER_TEMP/tools/lfs" "$RUNNER_TEMP/lfs.zip" > /dev/null
          cp "$(find "$RUNNER_TEMP/tools/lfs" -name git-lfs.exe | head -1)" "$RUNNER_TEMP/tools/bin/git-lfs.exe"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/pwsh" >> "$GITHUB_PATH"

      - name: CLI tools on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/pwsh" >> "$GITHUB_PATH"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34
        with:
          go-version: '1.27.1'
          cache: false

      - name: Resolve pins
        shell: bash
        run: |
          set -euo pipefail
          echo "GO_VERSION=$(go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -print-pin go-version)" >> "$GITHUB_ENV"
          echo "EDB_ZIP_SHA256=$(go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -print-pin edb-sha256)" >> "$GITHUB_ENV"
          echo "EDB_URL=$(go -C server run ./cmd/verify -repo-root "$GITHUB_WORKSPACE" -print-pin edb-url)" >> "$GITHUB_ENV"

      - name: Cache timer go-build
        shell: bash
        run: echo "CT0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Cache Go build
        id: cache-go-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: go-build-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Telemetry go-build
        shell: bash
        run: |
          set -euo pipefail
          . .devin/scripts/cache_telemetry.sh
          wall=$(awk -v n="$(date +%s.%N)" -v t="${CT0:-0}" 'BEGIN{printf "%.3f", (t > 0) ? n - t : 0}')
          cache_telemetry_emit go-build '${{ steps.cache-go-build.outputs.cache-hit == 'true' && 'hit' || 'miss' }}' "$wall"

      - name: Cache timer edb
        shell: bash
        run: echo "CT0=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Cache EDB Postgres
        id: edb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tools/pgsql
          key: edb-${{ runner.os }}-18.6-${{ env.EDB_ZIP_SHA256 }}

      - name: Telemetry edb
        shell: bash
        run: |
          set -euo pipefail
          . .devin/scripts/cache_telemetry.sh
          wall=$(awk -v n="$(date +%s.%N)" -v t="${CT0:-0}" 'BEGIN{printf "%.3f", (t > 0) ? n - t : 0}')
          cache_telemetry_emit edb '${{ steps.edb-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}' "$wall"

      - name: Provision EDB Postgres binaries
        if: steps.edb-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          curl -fSL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o "$RUNNER_TEMP/edb.zip" "$EDB_URL"
          echo "$EDB_ZIP_SHA256  $RUNNER_TEMP/edb.zip" | sha256sum -c -
          mkdir -p tools/pgsql && 7z x -y -otools/pgsql "$RUNNER_TEMP/edb.zip" > /dev/null
          if [ -d tools/pgsql/pgsql ]; then
            mv tools/pgsql/pgsql/* tools/pgsql/ && rmdir tools/pgsql/pgsql
          fi
          [ -f tools/pgsql/bin/pg_isready.exe ]

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip"
          echo "f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/protoc" && 7z x -y -o"$RUNNER_TEMP/protoc" "$RUNNER_TEMP/protoc.zip" > /dev/null
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc/bin/protoc" --version | grep -F "libprotoc 36.2"

      - name: Install staticcheck
        shell: bash
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Pre-Unity verify
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THINHTHAN_CACHE_HIT_GO: ${{ steps.cache-go-build.outputs.cache-hit }}
        run: |
          pwsh -NoProfile -File scripts/verify.ps1 -Phase pre-unity -ReportOut "$env:RUNNER_TEMP\verify-pre-unity.json"

      - name: Wait for Unity (Windows)
        id: wait-unity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_JOB: Unity (Windows)
        run: bash .devin/scripts/wait_job.sh

      - name: Check Unity (Windows) conclusion
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.wait-unity.outputs.conclusion }}" = "success" ]

      - name: Download unity-test-results-windows
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unity-test-results-windows
          path: unity-results/

      - name: Download visual-review
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: visual-review
          path: artifacts/visual-review/

      - name: Fold unity cache telemetry
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/cache-telemetry.jsonl"
          touch "$f"
          if [ -f unity-results/cache-telemetry.jsonl ]; then
            cat unity-results/cache-telemetry.jsonl >> "$f"
          fi

      - name: Unity phase verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THINHTHAN_CACHE_HIT_GO: ${{ steps.cache-go-build.outputs.cache-hit }}
        run: |
          pwsh -NoProfile -File scripts/verify.ps1 -Phase unity `
            -PreReport "$env:RUNNER_TEMP\verify-pre-unity.json" `
            -UnityResultsDir unity-results `
            -ReportOut artifacts/verify-report-windows.json

      - name: Upload verify-report-windows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-report-windows
          path: artifacts/verify-report-windows.json

      - name: Wait for Q0-Q6 verify (Linux)
        id: wait-linux
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_JOB: Q0-Q6 verify (Linux)
        run: bash .devin/scripts/wait_job.sh

      - name: Check Q0-Q6 verify (Linux) conclusion
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.wait-linux.outputs.conclusion }}" = "success" ]

      - name: Download verify-report-linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verify-report-linux
          path: linux-report/

      - name: Merge evidence
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify.ps1 -MergeReports `
            -LinuxReport linux-report/verify-report-linux.json `
            -WindowsReport artifacts/verify-report-windows.json `
            -OutManifest artifacts/evidence/manifest.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence
          path: artifacts/evidence/

